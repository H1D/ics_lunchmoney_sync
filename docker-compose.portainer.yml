services:
  telegram-bot:
    build:
      context: https://github.com/H1D/ics_lunchmoney_sync.git#main:telegram-bot
      dockerfile: Dockerfile
    container_name: telegram-bot
    restart: unless-stopped
    environment:
      - TOKEN=${TOKEN}
      - USER_ID=${USER_ID}
      - ICS_EMAIL=${ICS_EMAIL}
      - ICS_PASSWORD=${ICS_PASSWORD}
      - LUNCHMONEY_TOKEN=${LUNCHMONEY_TOKEN}
      - LUNCHMONEY_ASSET_ID=${LUNCHMONEY_ASSET_ID}
      - SYNC_DAYS=${SYNC_DAYS:-30}
      - BUSINESS_ICS_EMAIL=${BUSINESS_ICS_EMAIL:-}
      - BUSINESS_ICS_PASSWORD=${BUSINESS_ICS_PASSWORD:-}
      - BUSINESS_ICS_ACCOUNT_NUMBER=${BUSINESS_ICS_ACCOUNT_NUMBER:-}
      - BONNETJE_URL=${BONNETJE_URL:-}
      - BONNETJE_EMAIL=${BONNETJE_EMAIL:-}
      - BONNETJE_INGEST_TOKEN=${BONNETJE_INGEST_TOKEN:-}
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
